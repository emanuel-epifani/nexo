# ==========================================
# NEXO — Automated Release Pipeline
# ==========================================
# Triggered when you push a version tag (v*)
# Flow: You run `npm run release` locally → push → this runs automatically
#
# Auth:
#   NPM  → OIDC Trusted Publishing (no token needed, configure on npmjs.com)
#   Docker → DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets
#   Vercel → VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID secrets

name: Release

on:
  push:
    tags: ['v*']

env:
  VERSION: ${{ github.ref_name }}

jobs:
  # ─────────────────────────────────
  # 1. SERVER — Docker Multi-Arch (Native Builds)
  # ─────────────────────────────────
  release-server-amd64:
    name: 🐳 Docker — AMD64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: emanuelepifani/nexo:${{ env.VERSION }}-amd64

  release-server-arm64:
    name: 🐳 Docker — ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: emanuelepifani/nexo:${{ env.VERSION }}-arm64

  release-server-manifest:
    name: 🐳 Docker — Manifest
    runs-on: ubuntu-latest
    needs: [release-server-amd64, release-server-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            --tag emanuelepifani/nexo:${{ env.VERSION }} \
            --tag emanuelepifani/nexo:latest \
            emanuelepifani/nexo:${{ env.VERSION }}-amd64 \
            emanuelepifani/nexo:${{ env.VERSION }}-arm64

  # ─────────────────────────────────
  # 2. SDK — NPM (OIDC Trusted Publishing)
  # ─────────────────────────────────
  release-sdk:
    name: 📦 NPM — TypeScript SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@emanuelepifani'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: sdk/ts
        run: npm ci

      - name: Build SDK
        working-directory: sdk/ts
        run: npm run build --if-present

      - name: Publish to NPM
        working-directory: sdk/ts
        run: npm publish --access public --provenance

  # ─────────────────────────────────
  # 3. DOCS — Vercel
  # ─────────────────────────────────
  release-docs:
    name: 📄 Docs — Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy to Vercel
        working-directory: .
        run: npx -y vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────
  # 4. GITHUB RELEASE
  # ─────────────────────────────────
  create-github-release:
    name: 🎉 GitHub Release
    runs-on: ubuntu-latest
    needs: [release-server-manifest, release-sdk, release-docs]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Nexo ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Installation
            🐳 `docker pull emanuelepifani/nexo:${{ github.ref_name }}`
            📦 `npm install @emanuelepifani/nexo-client@${{ env.VERSION }}`
