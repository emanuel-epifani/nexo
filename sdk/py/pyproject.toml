[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo-client"
version = "4.0.3"
description = "High-performance Python Client for Nexo Broker"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Emanuele Pifani" }]
keywords = [
    "microservices", "event-driven", "message-broker", "queue", "job-queue",
    "stream", "event-streaming", "event-sourcing", "pubsub", "realtime",
    "store", "key-value-store", "python", "high-performance", "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
]

[project.urls]
Repository = "https://github.com/emanuel-epifani/nexo.git"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nexo = ["py.typed"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
log_cli = false
